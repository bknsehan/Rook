name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc \
            clang \
            llvm-dev \
            libclang-dev

      - name: Set up Rust (for rook-lsp)
        uses: dtolnay/rust-toolchain@stable

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DROKADE_ENABLE_LLVM=ON \
            -DROOK_BUILD_LSP=ON

      - name: Build Rokade and LSP
        run: |
          cmake --build build

      - name: Run Rokade Doctor
        run: |
          ./build/rokade doctor

      - name: Test C Backend Corpus
        run: |
          ROKADE=./build/rokade bash tests/run.sh

      - name: Test LLVM Backend Corpus
        run: |
          ROKADE=./build/rokade BACKEND=llvm bash tests/run.sh

      - name: Build & Test with AddressSanitizer (ASan / UBSan)
        run: |
          cmake -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUSE_SANITIZER=ON \
            -DROKADE_ENABLE_LLVM=ON \
            -DROOK_BUILD_LSP=OFF
          cmake --build build-asan
          ASAN_OPTIONS=detect_leaks=0 ROKADE=./build-asan/rokade bash tests/run.sh
          rm -rf build-asan

      - name: Verify CLI & Scaffolding
        run: |
          ./build/rokade --version
          ./build/rokade --help
          ./build/rokade new ci_sample_project
          cd ci_sample_project
          ../build/rokade build
          ../build/rokade run
          cd ..
          rm -rf ci_sample_project

      - name: Verify Documentation Generation
        run: |
          python3 scripts/generate_docs.py
          git diff --exit-code docs/rook-language-guide.html

  build-and-test-windows:
    name: Build & Test (Windows MSYS2 UCRT64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DROKADE_ENABLE_LLVM=ON \
            -DROOK_BUILD_LSP=OFF

      - name: Build Rokade
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Run Rokade Doctor
        shell: msys2 {0}
        run: |
          ./build/rokade.exe doctor

      - name: Test C Backend Corpus
        shell: msys2 {0}
        run: |
          ROKADE=./build/rokade.exe bash tests/run.sh

      - name: Verify CLI & Scaffolding
        shell: msys2 {0}
        run: |
          ./build/rokade.exe --version
          ./build/rokade.exe --help
          ./build/rokade.exe new ci_sample_project
          cd ci_sample_project
          ../build/rokade.exe build
          ../build/rokade.exe run
          cd ..
          rm -rf ci_sample_project
